server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location = /recording-view.html {
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /recording-view.html =404;
    }

    # The HTML entry point references content-hashed bundles and must never be
    # reused across deployments. Otherwise a first visit can boot the previous
    # dashboard version until the user manually reloads.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    # env.js is generated when the Cloud Run container starts.
    location = /env.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /env.js =404;
    }

    location ^~ /i18n/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
