name: Security

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  dependency-and-code-scan:
    name: Dependency & Go Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          fail-on-scopes: runtime,development,unknown
          license-check: false
          show-patched-versions: true
          # image-size DoS advisories (JXL/HEIF and ICNS parser infinite loops).
          # Exempted deliberately, scoped to these two IDs only:
          #  - No fixed release exists in the 1.x line: 1.2.1 IS the head of the
          #    `legacy` tag, and metro@0.84.4 declares `image-size: ^1.0.2`.
          #  - Forcing 2.0.2 was tried and breaks the build: metro's asset
          #    pipeline dies on the first PNG ("The 'list' argument must be an
          #    instance of SharedArrayBuffer, ArrayBuffer or ArrayBufferView").
          #    jest/tsc/lint stay green through that, only `expo export` catches
          #    it — so the override is not a safe option.
          #  - Reachability: image-size runs inside metro, the BUNDLER. It never
          #    executes in the shipped app; the exposure is a build-time DoS on a
          #    developer machine or CI runner from a malicious image asset.
          # Revisit when Expo/metro bumps to image-size 2.x.
          allow-ghsas: GHSA-5p2g-fcmc-qvqq, GHSA-w3rx-r6r6-pgpr

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
          repo-checkout: false

      - name: Check out target branch for OSV baseline
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: |
          git checkout "$GITHUB_BASE_REF"

      - name: Run OSV baseline scan
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output-file=osv-baseline.json
            --include-git-root
            -r
            ./

      - name: Check out current revision for OSV scan
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: |
          git checkout -f "$GITHUB_SHA"

      - name: Run OSV current scan
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output-file=osv-current.json
            --include-git-root
            -r
            ./

      - name: Fail on newly introduced OSV findings
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          # Gate policy. The plan (.agents/plans/20260704134950_cve_check_pipeline_plan.md)
          # assigns PR blocking to Dependency Review at `fail-on-severity: high` and
          # gives Trivy HIGH,CRITICAL; this step is the only scanner that shipped
          # without a threshold. Matching it keeps the three gates consistent.
          BLOCKING = {"HIGH", "CRITICAL", "UNKNOWN"}  # UNKNOWN blocks: fail closed

          # Time-bound ignores, per the plan's triage rule ("add a time-bound ignore
          # with a reason and follow-up issue"). Keep in sync with `allow-ghsas` on
          # the Dependency Review step above.
          #
          # image-size DoS advisories (JXL/HEIF and ICNS parser infinite loops):
          # no fixed release exists — 1.2.1 is the head of the `legacy` tag and
          # metro declares `image-size: ^1.0.2`. Forcing 2.x was tried and breaks
          # the Metro asset pipeline on the first PNG. image-size runs inside the
          # bundler, never in the shipped app. Revisit when Expo/metro moves to 2.x.
          #
          # GO-2026-5932 (golang.org/x/crypto): not a patchable defect — the advisory
          # says the x/crypto/openpgp package is unmaintained and unsafe by design.
          # Its affected range is `introduced: 0` with no fixed version, so every
          # release carries it and no bump can clear it. We do not import
          # x/crypto/openpgp anywhere, and govulncheck (call-graph based, run earlier
          # in this job) reports nothing. Without this entry the gate misfires on any
          # x/crypto version bump: findings are keyed by version, so moving an
          # already-affected package from 0.52.0 to 0.53.0 reads as "newly
          # introduced". Drop this if we ever add an openpgp dependency.
          IGNORED_IDS = {
              "GHSA-5p2g-fcmc-qvqq",
              "GHSA-w3rx-r6r6-pgpr",
              "GO-2026-5932",
          }

          def load(path):
              p = Path(path)
              if not p.exists() or p.stat().st_size == 0:
                  return {"results": []}
              return json.loads(p.read_text())

          def severity_of(vulnerability, cvss):
              """GitHub advisories carry database_specific.severity; fall back to the
              group's CVSS score, and treat anything unlabelled as blocking."""
              label = (vulnerability.get("database_specific") or {}).get("severity")
              if isinstance(label, str) and label.strip():
                  return label.strip().upper()
              try:
                  score = float(cvss)
              except (TypeError, ValueError):
                  return "UNKNOWN"
              if score >= 9.0:
                  return "CRITICAL"
              if score >= 7.0:
                  return "HIGH"
              if score >= 4.0:
                  return "MODERATE"
              return "LOW"

          def findings(path):
              doc = load(path)
              found = set()
              for result in doc.get("results", []):
                  source = result.get("source", {}).get("path", "")
                  source = source.replace("/github/workspace/", "")
                  for package in result.get("packages", []):
                      pkg = package.get("package", {})
                      pkg_key = (
                          source,
                          pkg.get("ecosystem", ""),
                          pkg.get("name", ""),
                          pkg.get("version", ""),
                      )
                      cvss_by_id = {}
                      for group in package.get("groups", []):
                          for gid in group.get("ids", []):
                              cvss_by_id[gid] = group.get("max_severity")
                      for vulnerability in package.get("vulnerabilities", []):
                          vuln_id = vulnerability.get("id")
                          if not vuln_id or vuln_id in IGNORED_IDS:
                              continue
                          if severity_of(vulnerability, cvss_by_id.get(vuln_id)) not in BLOCKING:
                              continue
                          found.add(pkg_key + (vuln_id,))
              return found

          baseline = findings("osv-baseline.json")
          current = findings("osv-current.json")
          introduced = sorted(current - baseline)

          if introduced:
              print("New high/critical OSV findings introduced by this change:")
              for source, ecosystem, name, version, vuln_id in introduced:
                  print(f"- {vuln_id}: {ecosystem} {name}@{version} from {source}")
              raise SystemExit(1)

          print(f"No new high/critical OSV findings introduced by this change. Current scan still contains {len(current)} blocking finding(s).")
          PY

      - name: Summarize full OSV scan
        if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          path = Path("osv-current.json")
          if not path.exists() or path.stat().st_size == 0:
              print("No OSV result file was produced.")
              raise SystemExit(0)

          doc = json.loads(path.read_text())
          count = 0
          for result in doc.get("results", []):
              for package in result.get("packages", []):
                  count += len(package.get("vulnerabilities", []))

          if count:
              print(f"::warning ::OSV full scan found {count} existing vulnerability finding(s). Review the workflow logs and Dependabot PRs.")
          else:
              print("OSV full scan found no vulnerabilities.")
          PY

  trivy-images:
    name: Container Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          cache: true
          version: v0.70.0

      - name: Build and scan images
        run: |
          set -euo pipefail

          while IFS='|' read -r name context image; do
            echo "::group::Build ${name} image"
            docker build -t "${image}:${GITHUB_SHA}" "${context}"
            echo "::endgroup::"

            echo "::group::Scan ${name} image"
            trivy image \
              --exit-code 1 \
              --ignore-unfixed \
              --pkg-types os,library \
              --severity HIGH,CRITICAL \
              "${image}:${GITHUB_SHA}"
            echo "::endgroup::"
          done <<'IMAGES'
          api|.|zeta-api-security
          dashboard|web/dashboard-next|zeta-dashboard-security
          landing|web/landing|zeta-landing-security
          IMAGES
